    description_es: Cuenta las partículas aterogénicas (una ApoB por partícula LDL, VLDL o Lp(a)).
    description_en: Counts the atherogenic particles (one ApoB per LDL, VLDL or Lp(a) particle).
    ranges:
      - {kind: lab_standard, sex: any, high: 90, source: ESC/EAS 2019 (riesgo moderado)}

