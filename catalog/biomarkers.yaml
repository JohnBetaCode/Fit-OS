# Fit-OS biomarker dictionary (docs/design.md §9.1). Versioned; contains NO user data.
#
# Default ranges are starting points taken from Roche reagent inserts and guidelines (ATP III, ADA, AHA,
# Endocrine Society); they don't replace the range printed by your lab or medical judgment.
# Bound convention: only `high` → v < high; only `low` → v ≥ low; both → low ≤ v ≤ high.
# `kind`: lab_standard | borderline (the user's own goal, `user_target`, comes with the seed, not here).
# `sex`: male | female | any. `age_min`/`age_max` inclusive; omitted = no limit.
# `unit_conversions`: factor to convert that unit to the canonical one (value × factor).
version: 1
biomarkers:
  # ── Lipids ───────────────────────────────────────────────────────────────
  - key: ldl_c
    name_es: Colesterol LDL
    name_en: LDL cholesterol
    loinc: "13457-7"
    category: Lípidos
    canonical_unit: mg/dL
    unit_conversions: {mmol/L: 38.67}
    aliases: [LDL, LDL-C, LDL cholesterol, Colesterol LDL, LDL colesterol, c-LDL, Colesterol de baja densidad]
    direction: lower
    decimals: 0
    sort_order: 10
    description_es: Colesterol que viaja en partículas LDL; su exceso se deposita en las arterias.
    description_en: Cholesterol carried in LDL particles; in excess it builds up in the arteries.
    ranges:
      - {kind: lab_standard, sex: any, high: 100, source: NCEP ATP III (óptimo)}
      - {kind: borderline, sex: any, low: 100, high: 129, source: NCEP ATP III (casi óptimo)}

  - key: hdl_c
    name_es: Colesterol HDL
    name_en: HDL cholesterol
    loinc: "2085-9"
    category: Lípidos
    canonical_unit: mg/dL
    unit_conversions: {mmol/L: 38.67}
    aliases: [HDL, HDL-C, HDL cholesterol, Colesterol HDL, HDL colesterol, c-HDL, Colesterol de alta densidad]
    direction: higher
    decimals: 0
    sort_order: 20
    description_es: Colesterol que las partículas HDL retiran de los tejidos hacia el hígado.
    description_en: Cholesterol that HDL particles carry from the tissues back to the liver.
    ranges:
      - {kind: lab_standard, sex: male, low: 40, source: NCEP ATP III / AHA}
      - {kind: lab_standard, sex: female, low: 50, source: NCEP ATP III / AHA}

  - key: triglycerides
    name_es: Triglicéridos
    name_en: Triglycerides
    loinc: "2571-8"
    category: Lípidos
    canonical_unit: mg/dL
    unit_conversions: {mmol/L: 88.57}
    aliases: [Triglycerides, Triglyceride, TG, Triglicéridos, Trigliceridos]
    direction: lower
    decimals: 0
    sort_order: 30
    description_es: Grasa circulante que sube con el exceso de azúcares, alcohol y la resistencia a la insulina.
    description_en: Circulating fat that rises with excess sugar, alcohol and insulin resistance.
    ranges:
      - {kind: lab_standard, sex: any, high: 150, source: NCEP ATP III}
      - {kind: borderline, sex: any, low: 150, high: 199, source: NCEP ATP III (limítrofe alto)}

  - key: tg_hdl_ratio
    name_es: Relación TG/HDL
    name_en: TG/HDL ratio
    loinc: null
    category: Lípidos
    canonical_unit: ratio
    aliases: [TG/HDL, TG/HDL ratio, TG:HDL, Triglycerides/HDL, Triglyceride/HDL ratio, Relación TG/HDL, Índice TG/HDL]
    direction: lower
    derived_from: [triglycerides, hdl_c]  # numerador ÷ denominador
    decimals: 2
    sort_order: 40
    description_es: Cociente triglicéridos ÷ HDL, marcador indirecto de resistencia a la insulina (referencia común < 3,0).
    description_en: Triglycerides ÷ HDL, an indirect marker of insulin resistance (common reference < 3.0).
    ranges: []

  - key: total_cholesterol
    name_es: Colesterol total
    name_en: Total cholesterol
    loinc: "2093-3"
    category: Lípidos
    canonical_unit: mg/dL
    unit_conversions: {mmol/L: 38.67}
    aliases: [Total cholesterol, Cholesterol, Cholesterol total, Colesterol total, Colesterol, TC]
    direction: lower
    decimals: 0
    sort_order: 50
    description_es: Suma del colesterol de todas las lipoproteínas.
    description_en: Sum of the cholesterol in all lipoproteins.
    ranges:
      - {kind: lab_standard, sex: any, high: 200, source: NCEP ATP III (deseable)}
      - {kind: borderline, sex: any, low: 200, high: 239, source: NCEP ATP III (limítrofe alto)}

  - key: apob
    name_es: Apolipoproteína B
    name_en: Apolipoprotein B
    loinc: "1884-6"
    category: Lípidos
    canonical_unit: mg/dL
    unit_conversions: {g/L: 100}
    aliases: [ApoB, Apo B, Apo-B, Apolipoprotein B, Apolipoproteína B, Apolipoproteina B]
    direction: lower
    decimals: 0
