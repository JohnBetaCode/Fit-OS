# Program templates (design §7.1, research §4). A program is a rotation of days; each slot is filled with the
# best eligible exercise for the day's equipment profile (pattern + muscle).
# Compounds 6–10 reps, isolation 10–15, RIR 2. Starting goal: ~10–12 direct hard sets per large muscle per
# week (secondary muscles count 0.5), cap 20, every muscle at least twice a week.
version: 1

default_for_days:
  2: full_body_3
  3: full_body_3
  4: upper_lower_4
  5: ppl_upper_lower_5
  6: ppl_6

defaults: &defaults
  compound_reps: [6, 10]
  isolation_reps: [10, 15]
  target_rir: 2
  weekly_sets_per_muscle: [10, 12]
  weekly_sets_cap: 20
  deload_every_weeks: 6

templates:
  full_body_3:
    name: Cuerpo completo ×3
    split_kind: full_body
    days_per_week: 3
    config: *defaults
    days:
      - name: Cuerpo completo A
        focus: [quads, chest, lats, hamstrings]
        slots:
          - {slot: squat, pattern: squat, muscle: quads, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: press_horizontal, pattern: push_horizontal, muscle: chest, sets: 4, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: pull_vertical, pattern: pull_vertical, muscle: lats, sets: 4, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: hinge, pattern: hinge, muscle: hamstrings, sets: 4, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: lateral_raise, pattern: lateral_raise, muscle: delts, sets: 3, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: core, pattern: core_flexion, muscle: abs, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
      - name: Cuerpo completo B
        focus: [quads, delts, upper_back, glutes]
        slots:
          - {slot: lunge, pattern: lunge, muscle: quads, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: press_vertical, pattern: push_vertical, muscle: delts, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: row, pattern: pull_horizontal, muscle: upper_back, sets: 4, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: hip_thrust, pattern: hip_thrust, muscle: glutes, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: fly, pattern: chest_fly, muscle: chest, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: biceps, pattern: elbow_flexion, muscle: biceps, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: calves, pattern: calf_raise, muscle: calves, sets: 3, rep_min: 10, rep_max: 15, target_rir: 2}
      - name: Cuerpo completo C
        focus: [quads, chest, upper_back, hamstrings]
        slots:
          - {slot: squat, pattern: squat, muscle: quads, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: press_horizontal, pattern: push_horizontal, muscle: chest, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: row, pattern: pull_horizontal, muscle: upper_back, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: leg_curl, pattern: knee_flexion, muscle: hamstrings, sets: 4, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: lateral_raise, pattern: lateral_raise, muscle: delts, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: triceps, pattern: elbow_extension, muscle: triceps, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: calves, pattern: calf_raise, muscle: calves, sets: 3, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: core, pattern: core_stability, muscle: abs, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}

  upper_lower_4:
    name: Torso / Pierna ×4
    split_kind: upper_lower
    days_per_week: 4
    config: *defaults
