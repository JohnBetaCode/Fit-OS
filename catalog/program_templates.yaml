          - {slot: row, pattern: pull_horizontal, muscle: upper_back, sets: 4, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: press_vertical, pattern: push_vertical, muscle: delts, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: pull_vertical, pattern: pull_vertical, muscle: lats, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: biceps, pattern: elbow_flexion, muscle: biceps, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: triceps, pattern: elbow_extension, muscle: triceps, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: rear_delt, pattern: rear_delt, muscle: delts, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
      - name: Pierna A
        focus: [quads, hamstrings, calves]
        slots:
          - {slot: squat, pattern: squat, muscle: quads, sets: 4, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: hinge, pattern: hinge, muscle: hamstrings, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: leg_extension, pattern: knee_extension, muscle: quads, sets: 3, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: leg_curl, pattern: knee_flexion, muscle: hamstrings, sets: 3, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: calves, pattern: calf_raise, muscle: calves, sets: 3, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: core, pattern: core_flexion, muscle: abs, sets: 3, rep_min: 10, rep_max: 15, target_rir: 2}
      - name: Torso B
        focus: [lats, chest, delts]
        slots:
          - {slot: pull_vertical, pattern: pull_vertical, muscle: lats, sets: 4, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: press_horizontal, pattern: push_horizontal, muscle: chest, sets: 4, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: row, pattern: pull_horizontal, muscle: upper_back, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: lateral_raise, pattern: lateral_raise, muscle: delts, sets: 3, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: fly, pattern: chest_fly, muscle: chest, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: triceps, pattern: elbow_extension, muscle: triceps, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: biceps, pattern: elbow_flexion, muscle: biceps, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
      - name: Pierna B
        focus: [hamstrings, glutes, quads, calves]
        slots:
          - {slot: hinge, pattern: hinge, muscle: hamstrings, sets: 4, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: lunge, pattern: lunge, muscle: quads, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: hip_thrust, pattern: hip_thrust, muscle: glutes, sets: 3, rep_min: 6, rep_max: 10, target_rir: 2}
          - {slot: leg_extension, pattern: knee_extension, muscle: quads, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: calves, pattern: calf_raise, muscle: calves, sets: 3, rep_min: 10, rep_max: 15, target_rir: 2}
          - {slot: core, pattern: core_stability, muscle: abs, sets: 2, rep_min: 10, rep_max: 15, target_rir: 2}

