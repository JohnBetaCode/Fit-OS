<!doctype html>
<!-- Source of the WhatsApp group picture (docs/images/group-icon.png, with the wordmark) and the app icons
     (app/fitos/web/static/icons/*.png, "#mark": the symbol full-bleed, safe for maskable icons).
     The symbol is app/fitos/web/static/icons/icon.svg. Render: see docs/development.md#icons -->
<html><head><meta charset="utf-8"><style>
  :root{--bg:#080d16;--panel:#0f1624;--panel2:#16203a;--line:#22304a;--ink:#e8eef8;--mute:#94a3b8;--accent:#3b82f6;--teal:#14b8a6}
  *{box-sizing:border-box;margin:0}
  html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg)}
  body{font-family:"Inter","Segoe UI",Roboto,ui-sans-serif,system-ui,sans-serif;color:var(--ink);position:relative;
       display:grid;place-items:center}
  .glow{position:absolute;border-radius:50%;filter:blur(9vw)}
  .g1{width:70vw;height:70vw;background:var(--accent);opacity:.24;left:15vw;top:6vw}
  .g2{width:50vw;height:40vw;background:var(--teal);opacity:.16;right:-12vw;bottom:-14vw}
  .grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),
        linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:5vw 5vw;opacity:.35;
        mask-image:radial-gradient(circle at 50% 50%,#000 25%,transparent 62%)}
  .stack{position:relative;display:flex;flex-direction:column;align-items:center;gap:2.6vw;margin-top:-2vw}
  img{width:46vw;height:46vw;filter:drop-shadow(0 1.5vw 3vw rgba(0,0,0,.55))}
  .word{font-size:13.5vw;font-weight:800;letter-spacing:-.5vw;line-height:1}
  .word span{background:linear-gradient(90deg,var(--accent),var(--teal));-webkit-background-clip:text;color:transparent}
  .sub{font-size:3.6vw;font-weight:600;letter-spacing:1.1vw;color:var(--mute);margin-top:-.4vw}
  /* #mark: the icon itself, full-bleed (the OS rounds or masks it) */
  body.mark{background:#16203a}
  body.mark .glow,body.mark .grid,body.mark .word,body.mark .sub{display:none}
  body.mark img{position:fixed;left:50%;top:50%;width:112vw;height:112vw;transform:translate(-50%,-50%);filter:none}
</style></head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
  <div class="stack">
    <img src="../../app/fitos/web/static/icons/icon.svg" alt="">
    <div class="word">Fit<span>·</span>OS</div>
    <div class="sub">PERSONAL TRAINER</div>
  </div>
  <script>if (location.hash === "#mark") document.body.classList.add("mark");</script>
</body></html>
